# Deletes old ghcr.io/narumedsr-p/{web,api} package versions so abandoned
# releases (published but never merged into gitops) don't accumulate
# forever. Keeps the most-recent N versions of each package regardless of
# age, so anything a live kustomization.yaml could still reference (beta or
# prod, current or one rollback back) is never touched — only genuinely old
# cruft gets removed.
#
# Runs on this repo's default branch (v2) since scheduled workflows only
# fire from there, not from v2-beta/v2-prod — this workflow is otherwise
# unrelated to the app code on this branch.
name: Cleanup old ghcr.io package versions

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [web, api]
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
